interface:
  display_name: "RWKV OA"
  short_description: "通过已连接的 RWKV OA 工具查询办公信息并处理已授权事务"
  default_prompt: "使用 $rwkv-oa 帮我处理 OA 事务，先根据我的需求选择当前可用的工具。"

dependencies:
  tools:
    - type: "mcp"
      value: "oa_plugin"
      description: "RWKV OA MCP service bundled with this plugin"

policy:
  allow_implicit_invocation: true
